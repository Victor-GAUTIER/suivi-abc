<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test connexion Google (temporaire)</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
      button { font-size: 1rem; padding: 0.6rem 1rem; }
      pre { background: #f3f3f3; padding: 0.8rem; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Test connexion Google</h1>
    <p>Page temporaire : elle fait le même appel que le test dans la console, depuis un vrai bouton.</p>
    <button id="bouton" type="button">Tester la connexion Google</button>
    <pre id="journal"></pre>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script>
      const CLIENT_ID = '1072661148140-r9rpriqjafh1l4mqkvbbpkui6ahllaqd.apps.googleusercontent.com'
      const SCOPE =
        'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file'
      const journal = document.getElementById('journal')
      let t0 = Date.now()
      const etat = () => `focus=${document.hasFocus()} visible=${document.visibilityState}`
      const log = (message) => {
        const ligne = `[TEST] ${message} (+${Date.now() - t0} ms)`
        console.info(ligne)
        journal.textContent += ligne + '\n'
      }
      ;['blur', 'focus', 'pagehide', 'beforeunload'].forEach((type) =>
        window.addEventListener(type, () => log(`page : ${type} — ${etat()}`)),
      )
      document.addEventListener('visibilitychange', () => log(`page : visibilitychange — ${etat()}`))

      log(`adresse = ${location.href}`)
      log(`contrôlée par un service worker = ${navigator.serviceWorker?.controller ? 'oui' : 'non'}`)
      log(`application installée (standalone) = ${matchMedia('(display-mode: standalone)').matches ? 'oui' : 'non'}`)
      log(`window.opener = ${window.opener ? 'présent' : 'absent'}`)

      document.getElementById('bouton').addEventListener('click', () => {
        t0 = Date.now()
        log(`demande de jeton — ${etat()}`)
        google.accounts.oauth2
          .initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPE,
            callback: (r) => log(r.access_token ? 'jeton reçu' : `réponse sans jeton ${JSON.stringify(r)}`),
            error_callback: (e) => log(`erreur Google : ${e.type}`),
          })
          .requestAccessToken({ prompt: 'consent' })
      })
    </script>
  </body>
</html>
